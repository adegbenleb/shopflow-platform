[project]
name = "shopflow-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Blessing Adegbenle", email = "adegbenleb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
shopflow-platform = "shopflow_platform:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.2",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
# The DAG helper modules live in ingestion/dags (Airflow puts that folder on sys.path).
pythonpath = ["ingestion/dags"]
