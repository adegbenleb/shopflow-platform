version: 2

models:
  - name: dim_customers
    description: One row per real customer. Postal codes are cut to an area for privacy.
    columns:
      - name: customer_key
        data_tests: [unique, not_null]

  - name: dim_products
    columns:
      - name: product_key
        data_tests: [unique, not_null]

  - name: dim_sellers
    columns:
      - name: seller_key
        data_tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fct_orders
    description: One row per order, with item, payment, review and delivery facts.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: order_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_order_items
    description: One row per product line in an order.
    columns:
      - name: product_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: seller_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_key

  - name: mart_marketing_funnel
    description: One row per marketing lead, showing whether it became a seller and what it sold.
    columns:
      - name: lead_id
        data_tests: [unique, not_null]
