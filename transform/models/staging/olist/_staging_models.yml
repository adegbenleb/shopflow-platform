version: 2

models:
  - name: stg_olist__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: order_customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: order_customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['created', 'approved', 'invoiced', 'processing', 'shipped', 'delivered', 'canceled', 'unavailable']

  - name: stg_olist__customers
    columns:
      - name: order_customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null