shopflow:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 15432
      user: shopflow
      password: "{{ env_var('POSTGRES_PASSWORD', 'shopflow') }}"
      dbname: shopflow
      schema: analytics
      threads: 4


    docker:
      type: postgres
      host: postgres
      port: 5432
      # No fallbacks: a missing variable stops dbt with a clear error
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: analytics
      threads: 4